services:
  nginx:
    container_name: erp-nginx
    image: nginx:1.27-alpine
    ports:
      # Local: 8080 evita conflicto con el frontend u otros servicios en :80 del host.
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - php
    networks:
      - erp_net

  mailpit:
    container_name: erp-mailpit
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - erp_net

  php:
    container_name: erp-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
      - mailpit
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-erp-backend}
      MQTT_DISABLED: ${MQTT_DISABLED:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@erp.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ERP Clinic}
      AUTH_USER_TTL: ${AUTH_USER_TTL:-1800}
      AUTH_CLINIC_TTL: ${AUTH_CLINIC_TTL:-28800}
      RECOVERY_TTL_MINUTES: ${RECOVERY_TTL_MINUTES:-60}
    networks:
      - erp_net

  postgres:
    container_name: erp-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-erp}
      POSTGRES_USER: ${DB_USERNAME:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
    ports:
      # Solo localhost en desarrollo; en prod docker-compose.prod.yml anula la publicación.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - erp_net

  redis:
    container_name: erp-redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_net

  mosquitto:
    container_name: erp-mosquitto
    image: eclipse-mosquitto:2
    user: "0:0"
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    entrypoint: ["/bin/sh", "/mosquitto-entrypoint.sh"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/docker-entrypoint.sh:/mosquitto-entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - erp_net

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:

networks:
  erp_net:
    driver: bridge
