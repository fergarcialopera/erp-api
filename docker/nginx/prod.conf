# Producción: API en :8080 del host. CORS: origen del SPA (otro repo/puerto, normalmente :80).
# $cors_allow_origin debe coincidir con FRONTEND_URL en .env.production del API.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    set $cors_allow_origin "http://212.227.145.0";

    location /uploads/ {
        alias /var/www/html/storage/uploads/;
    }

    location / {
        include /etc/nginx/snippets/cors.conf;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/cors.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }
}
