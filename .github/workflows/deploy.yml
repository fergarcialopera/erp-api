name: Deploy ERP

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_IONOS.env

    steps:
      - name: Deploy to IONOS VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            APP_DIR=/opt/erp-api
            REPO_URL=https://github.com/fergarcialopera/erp-api.git

            if [ -f "${APP_DIR}/scripts/deploy-remote.sh" ]; then
              exec env APP_DIR="${APP_DIR}" REPO_URL="${REPO_URL}" bash "${APP_DIR}/scripts/deploy-remote.sh"
            fi

            if [ -d "${APP_DIR}/.git" ]; then
              cd "${APP_DIR}"
              git fetch origin
              git pull origin main
            else
              git clone "${REPO_URL}" "${APP_DIR}"
            fi

            exec env APP_DIR="${APP_DIR}" REPO_URL="${REPO_URL}" bash "${APP_DIR}/scripts/deploy-remote.sh"
