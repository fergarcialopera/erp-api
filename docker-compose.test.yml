# Override para tests de integración: la API (PHP-FPM) usa erp_test mientras corre la suite.
# Tras los tests, restaurar con: composer test:docker:restore
# O usar el flujo completo: composer test:docker (activa test, ejecuta phpunit, restaura erp).
services:
  php:
    environment:
      APP_ENV: testing
      DB_DATABASE: erp_test
      MQTT_DISABLED: "true"
