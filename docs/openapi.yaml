openapi: 3.0.3
info:
  title: ERP Clinic Stock API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: System
    description: Endpoints de salud y estado general.
  - name: Auth
    description: Autenticacion y contexto de usuario.
  - name: Inventory
    description: Gestion de inventario por clinica.
  - name: EntryLogs
    description: Registros de entrada de stock.
  - name: ExitLogs
    description: Registros de salida de stock.
  - name: Incidents
    description: Gestion de incidencias.
  - name: Settings
    description: Configuracion por clinica.
  - name: Clinic
    description: Datos y configuracion de clinica.
  - name: Products
    description: Catalogo global de productos, relaciones (categoria, proveedores) y visibilidad por clinica.
  - name: Categories
    description: Categorias del catalogo de productos.
  - name: Subcategories
    description: Subcategorias del catalogo de productos.
  - name: Brands
    description: Marcas del catalogo de productos.
  - name: SubBrands
    description: Submarcas del catalogo de productos, dependientes de una marca.
  - name: Species
    description: Especies animales del catalogo de productos.
  - name: Specialties
    description: Especialidades del catalogo de productos.
  - name: ProductTags
    description: Etiquetas de producto (N:M con products).
  - name: ProductImports
    description: Importacion CSV de productos (analisis dry-run y preview).
  - name: Suppliers
    description: Proveedores del catalogo de productos.
  - name: DispensingTypes
    description: Tipos de dispensacion y roles operativos autorizados.
  - name: Roles
    description: Roles operativos de locker; independientes de users.role de autenticacion API.
  - name: Users
    description: Usuarios por clinica.
  - name: Ambientes
    description: Ambientes por clinica.
  - name: Zones
    description: Compartimentos por clinica.
  - name: Audit
    description: Auditoria de accesos y actividad del sistema.
  - name: Docs
    description: Documentacion OpenAPI y UI.
paths:
  /up:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: OK
  /api/v1/auth/clinics:
    get:
      summary: List visible clinics for kiosk login
      tags: [Auth]
      responses:
        '200':
          description: Clinics
  /api/v1/auth/clinic/login:
    post:
      summary: Clinic access token (kiosk step 1)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinic_id, password]
              properties:
                clinic_id:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Clinic session
        '401':
          description: Invalid credentials
  /api/v1/auth/clinic/logout:
    post:
      summary: Invalidate clinic session
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
  /api/v1/auth/staff:
    get:
      summary: List active staff for clinic session
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff list
  /api/v1/auth/login/pin:
    post:
      summary: User login with PIN (kiosk step 2)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, pin]
              properties:
                user_id:
                  type: string
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
                  pattern: '^[0-9]{4}$'
                  description: Exactly 4 numeric digits
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
        '422':
          description: Invalid PIN format
        '423':
          description: PIN locked, use classic login
  /api/v1/auth/login:
    post:
      summary: Classic login (email and password)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
        '423':
          description: User locked
  /api/v1/auth/recovery/clinic:
    post:
      summary: Request clinic password recovery (ADMIN email)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted
  /api/v1/auth/recovery/user:
    post:
      summary: Request user password or PIN recovery
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, type]
              properties:
                email:
                  type: string
                type:
                  type: string
                  enum: [user_password, user_pin]
      responses:
        '202':
          description: Accepted
  /api/v1/auth/recovery/confirm:
    post:
      summary: Confirm recovery token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, type]
              properties:
                token:
                  type: string
                type:
                  type: string
                new_password:
                  type: string
                new_pin:
                  type: string
                  minLength: 4
                  maxLength: 4
                  pattern: '^[0-9]{4}$'
                  description: Exactly 4 numeric digits (required when type is user_pin)
      responses:
        '200':
          description: Confirmed
  /api/v1/auth/logout:
    post:
      summary: Logout (invalidate current token)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
        '401':
          description: Unauthorized
  /api/v1/me:
    get:
      summary: Current authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MeUser'
                  meta:
                    type: object
        '401':
          description: Unauthorized
  /api/v1/clinic:
    get:
      summary: Get current clinic
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clinic
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /api/v1/clinic/products/{product_id}:
    patch:
      summary: Toggle product visibility for a clinic (ADMIN of clinic or SUPER_ADMIN)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visible]
              properties:
                visible:
                  type: boolean
                clinic_id:
                  type: string
                  description: Required for SUPER_ADMIN without active clinic in token
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
  /api/v1/clinic/ambientes/{ambiente_id}:
    patch:
      summary: Toggle ambiente visibility for a clinic (ADMIN of clinic or SUPER_ADMIN)
      tags: [Ambientes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visible]
              properties:
                visible:
                  type: boolean
                clinic_id:
                  type: string
                  description: Required for SUPER_ADMIN without active clinic in token
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
  /api/v1/clinics:
    get:
      summary: List all clinics (SUPER_ADMIN)
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clinics
        '403':
          description: Forbidden
    post:
      summary: Create clinic (SUPER_ADMIN)
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
        '403':
          description: Forbidden
  /api/v1/clinics/{clinic_id}:
    patch:
      summary: Update clinic (SUPER_ADMIN)
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
  /api/v1/clinics/{clinic_id}/ambientes:
    post:
      summary: Associate ambiente to clinic (SUPER_ADMIN)
      tags: [Ambientes]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Associated
        '403':
          description: Forbidden
  /api/v1/clinics/{clinic_id}/ambientes/{ambiente_id}:
    delete:
      summary: Disassociate ambiente from clinic (SUPER_ADMIN)
      tags: [Ambientes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
        '403':
          description: Forbidden
  /api/v1/clinics/{clinic_id}/products/{product_id}:
    patch:
      summary: Toggle product visibility in a specific clinic (ADMIN or SUPER_ADMIN)
      tags: [Products]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
  /api/v1/clinics/{clinic_id}/ambientes/{ambiente_id}:
    patch:
      summary: Toggle ambiente visibility in a specific clinic (ADMIN or SUPER_ADMIN)
      tags: [Ambientes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
  /api/v1/clinic/image:
    post:
      summary: Upload clinic image
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete clinic image
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
  /api/v1/clinic/recovery:
    post:
      summary: ADMIN resend clinic password recovery email
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Accepted
  /api/v1/clinic/settings:
    patch:
      summary: Patch clinic settings
      tags: [Clinic]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                open_latency_ms:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated settings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/inventory:
    get:
      summary: List inventory by clinic
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          type: object
                          properties:
                            id: { type: string }
                            sku: { type: string }
                            name: { type: string }
                        quantity_total: { type: integer }
                        updated_at:
                          type: string
                          nullable: true
                        locations:
                          type: array
                          items:
                            type: object
                            properties:
                              quantity: { type: integer }
                              zone:
                                nullable: true
                                oneOf:
                                  - type: 'null'
                                  - type: object
                                    properties:
                                      id: { type: string }
                                      code: { type: string }
                              ambiente:
                                nullable: true
                                oneOf:
                                  - type: 'null'
                                  - type: object
                                    properties:
                                      id: { type: string }
                                      name: { type: string }
                  meta:
                    type: object
              example:
                data:
                  - product: { id: "10000000-0000-4000-8000-000000000001", sku: "SR-GLV-001", name: "Guantes de nitrilo talla M" }
                    quantity_total: 165
                    updated_at: "2026-05-07T08:00:00+02:00"
                    locations:
                      - quantity: 120
                        zone: { id: "50000000-0000-4000-8000-000000000001", code: "A1-C1" }
                        ambiente: { id: "40000000-0000-4000-8000-000000000001", name: "Ambiente Urgencias A1" }
                      - quantity: 45
                        zone: null
                        ambiente: null
                meta: {}
        '401':
          description: Unauthorized
  /api/v1/inventory/products/{product_id}:
    patch:
      summary: Adjust product inventory quantities (ADMIN only, for incident correction)
      description: |
        Sets stock quantities per location for a product. Does not create entry/exit logs.
        Restricted to ADMIN role.
      tags: [Inventory]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locations]
              properties:
                locations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [quantity]
                    properties:
                      quantity:
                        type: integer
                        minimum: 0
                      zone_id:
                        type: string
                        format: uuid
                        nullable: true
            example:
              locations:
                - quantity: 12
                  zone_id: "50000000-0000-4000-8000-000000000001"
                - quantity: 3
                  zone_id: null
      responses:
        '200':
          description: Updated stock by location
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductStockLocations'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (requires ADMIN)
        '404':
          description: Product not found
        '422':
          description: Validation error
  /api/v1/product-imports:
    get:
      summary: List product import sessions (SUPER_ADMIN)
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Import sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductImport'
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Upload CSV and run dry-run analysis (SUPER_ADMIN)
      description: >
        Accepts an Odoo product export CSV delimited by semicolon (`;`).
        Comma-delimited files are rejected with structural error `wrong_delimiter`
        (usually an export misconfiguration). Decimal values use Spanish format (`10,49`).
        Field name in multipart: `file`. Max size 10MB.
      tags: [ProductImports]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Semicolon-delimited CSV export from Odoo (max 10MB)
      responses:
        '201':
          description: Analysis completed and persisted (status may be ready_for_review or invalid)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductImportDetail'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation or upload error (missing file, wrong type, size)
  /api/v1/product-imports/{id}:
    get:
      summary: Get product import session detail (SUPER_ADMIN)
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import detail with catalog preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductImportDetail'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/product-imports/{id}/rows:
    get:
      summary: List analyzed rows for an import (SUPER_ADMIN)
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [ready, conflict, invalid, created, updated, failed, skipped]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Import rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductImportRow'
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    patch:
      summary: Bulk set decision on conflict rows (SUPER_ADMIN)
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [create_new, update_existing, skip]
                status:
                  type: string
                  enum: [conflict]
                  default: conflict
      responses:
        '200':
          description: Bulk decision applied
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation error
  /api/v1/product-imports/{id}/rows/{row_id}:
    patch:
      summary: Set decision on a conflict row (SUPER_ADMIN)
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: row_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [create_new, update_existing, skip]
      responses:
        '200':
          description: Row updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductImportRow'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation error
  /api/v1/product-imports/{id}/confirm:
    post:
      summary: Confirm import and apply changes (SUPER_ADMIN)
      description: >
        Requires all conflict rows to have a decision. Creates catalog entities as needed,
        then creates/updates products per row. Invalid rows are left untouched.
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductImportDetail'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Undecided conflicts or invalid state
  /api/v1/product-imports/{id}/cancel:
    post:
      summary: Cancel an import session in review (SUPER_ADMIN)
      tags: [ProductImports]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import cancelled
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Import is not ready for review
  /api/v1/products:
    get:
      summary: List products (STAFF+)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
          description: |
            Filter by products.is_active. Omit to include both (except clinic staff view,
            which always forces active+visible). Do not confuse omitted with active=false.
        - in: query
          name: category_id
          required: false
          schema:
            type: string
            format: uuid
          description: Exact match on products.category_id
        - in: query
          name: subcategory_id
          required: false
          schema:
            type: string
            format: uuid
          description: Exact match on products.subcategory_id
        - in: query
          name: brand_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: dispensing_type_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: supplier_id
          required: false
          schema:
            type: string
            format: uuid
          description: Products with at least one row in product_suppliers for this supplier
        - in: query
          name: search
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Case-insensitive substring match on name, barcode, internal_reference, sku.
            Empty/whitespace ignored. Combined with other filters using AND.
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    post:
      summary: Create product (SUPER_ADMIN)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateBody'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/products/{id}:
    get:
      summary: Get product (STAFF+)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product detail with suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    patch:
      summary: Patch product (SUPER_ADMIN)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
