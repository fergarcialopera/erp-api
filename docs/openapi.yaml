    Specialty:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: Server-generated; read-only. Not accepted on create/patch.
        is_active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    ProductTag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: Server-generated; read-only. Not accepted on create/patch.
        is_active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    ProductImport:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        status:
          type: string
          enum: [analyzing, ready_for_review, invalid, processing, completed, completed_with_errors, cancelled]
        created_by: { type: string, format: uuid }
        created_by_email: { type: string, format: email, nullable: true }
        created_by_name: { type: string, nullable: true }
        total_rows: { type: integer }
        ready_count: { type: integer }
        conflict_count: { type: integer }
        invalid_count: { type: integer }
        created_count: { type: integer }
        updated_count: { type: integer }
        failed_count: { type: integer }
        skipped_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
    ProductImportDetail:
      allOf:
        - $ref: '#/components/schemas/ProductImport'
        - type: object
          properties:
            structural_errors:
              type: array
              description: File-level errors (no product rows persisted when present)
              items:
                $ref: '#/components/schemas/ProductImportIssue'
            catalog_preview:
              type: object
              description: Catalog entities that would be created on confirm
              additionalProperties:
                type: array
                items: { type: string }
    ProductImportIssue:
      type: object
      description: >
        Machine-readable issue for frontend i18n. Prefer `code` over parsing `message`.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable error/warning code (see ProductImportIssueCode)
          enum:
            - empty_file
            - wrong_delimiter
            - missing_headers
            - unknown_headers
            - orphan_continuation_row
            - no_product_rows
            - missing_name
            - unexpected_product_type
            - duplicate_internal_reference_in_file
            - missing_supplier_vendor
            - barcode_already_exists
            - national_code_already_exists
            - subcategory_without_category
            - sub_brand_without_brand
            - missing_resolved_payload
            - import_failed
          x-codes-doc: |
            Structural (session invalid): empty_file, wrong_delimiter, missing_headers,
            unknown_headers, orphan_continuation_row, no_product_rows.
            Row invalid: missing_name, duplicate_internal_reference_in_file,
            missing_supplier_vendor, barcode_already_exists, national_code_already_exists,
            subcategory_without_category, sub_brand_without_brand.
            Row warning: unexpected_product_type.
            Confirm failure: missing_resolved_payload, import_failed.
        message:
          type: string
          description: English technical message (fallback; UI should translate by code)
        column:
          type: string
          nullable: true
          description: CSV header name when the issue is column-specific
    ProductImportIssueCode:
      type: string
      description: Vocabulary of ProductImport issue codes for frontend translation maps
      enum:
        - empty_file
        - wrong_delimiter
        - missing_headers
        - unknown_headers
        - orphan_continuation_row
        - no_product_rows
        - missing_name
        - unexpected_product_type
        - duplicate_internal_reference_in_file
        - missing_supplier_vendor
        - barcode_already_exists
        - national_code_already_exists
        - subcategory_without_category
        - sub_brand_without_brand
        - missing_resolved_payload
        - import_failed
    ProductImportRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        import_id: { type: string, format: uuid }
        row_number: { type: integer }
        status:
          type: string
          enum: [ready, conflict, invalid, created, updated, failed, skipped]
        decision:
          type: string
          nullable: true
          enum: [create_new, update_existing, skip]
        existing_product_id: { type: string, format: uuid, nullable: true }
        result_product_id:
          type: string
          format: uuid
          nullable: true
          description: Set after confirm; links product to this import for audit trail
        normalized: { type: object, nullable: true }
        resolved: { type: object, nullable: true }
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ProductImportIssue'
        diff:
          type: object
