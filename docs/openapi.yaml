openapi: 3.0.3
info:
  title: ERP Clinic Stock API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: System
    description: Endpoints de salud y estado general.
  - name: Auth
    description: Autenticacion y contexto de usuario.
  - name: Inventory
    description: Gestion de inventario por clinica.
  - name: EntryLogs
    description: Registros de entrada de stock.
  - name: ExitLogs
    description: Registros de salida de stock.
  - name: Incidents
    description: Gestion de incidencias.
  - name: Settings
    description: Configuracion por clinica.
  - name: Clinic
    description: Datos y configuracion de clinica.
  - name: Products
    description: Productos por clinica.
  - name: Users
    description: Usuarios por clinica.
  - name: Ambientes
    description: Ambientes por clinica.
  - name: Compartments
    description: Compartimentos por clinica.
  - name: Docs
    description: Documentacion OpenAPI y UI.
paths:
  /up:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: OK
  /api/v1/auth/clinics:
    get:
      summary: List visible clinics for kiosk login
      tags: [Auth]
      responses:
        '200':
          description: Clinics
  /api/v1/auth/clinic/login:
    post:
      summary: Clinic access token (kiosk step 1)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinic_id, password]
              properties:
                clinic_id:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Clinic session
        '401':
          description: Invalid credentials
  /api/v1/auth/clinic/logout:
    post:
      summary: Invalidate clinic session
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
  /api/v1/auth/staff:
    get:
      summary: List active staff for clinic session
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff list
  /api/v1/auth/login/pin:
    post:
      summary: User login with PIN (kiosk step 2)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, pin]
              properties:
                user_id:
                  type: string
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
                  pattern: '^[0-9]{4}$'
                  description: Exactly 4 numeric digits
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
        '422':
          description: Invalid PIN format
        '423':
          description: PIN locked, use classic login
  /api/v1/auth/login:
    post:
      summary: Classic login (email and password)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
        '423':
          description: User locked
  /api/v1/auth/recovery/clinic:
    post:
      summary: Request clinic password recovery (ADMIN email)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted
  /api/v1/auth/recovery/user:
    post:
      summary: Request user password or PIN recovery
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, type]
              properties:
                email:
                  type: string
                type:
                  type: string
                  enum: [user_password, user_pin]
      responses:
        '202':
          description: Accepted
  /api/v1/auth/recovery/confirm:
    post:
      summary: Confirm recovery token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, type]
              properties:
                token:
                  type: string
                type:
                  type: string
                new_password:
                  type: string
                new_pin:
                  type: string
                  minLength: 4
                  maxLength: 4
                  pattern: '^[0-9]{4}$'
                  description: Exactly 4 numeric digits (required when type is user_pin)
      responses:
        '200':
          description: Confirmed
  /api/v1/auth/logout:
    post:
      summary: Logout (invalidate current token)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
        '401':
          description: Unauthorized
  /api/v1/me:
    get:
      summary: Current authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user context
        '401':
          description: Unauthorized
  /api/v1/clinic:
    get:
      summary: Get current clinic
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clinic
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    patch:
      summary: Update clinic settings (visible, password, name)
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
  /api/v1/clinic/image:
    post:
      summary: Upload clinic image
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete clinic image
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated
  /api/v1/clinic/recovery:
    post:
      summary: ADMIN resend clinic password recovery email
      tags: [Clinic]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Accepted
  /api/v1/clinic/settings:
    patch:
      summary: Patch clinic settings
      tags: [Clinic]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                open_latency_ms:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated settings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/inventory:
    get:
      summary: List inventory by clinic
      tags: [Inventory]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        product:
                          type: object
                          properties:
                            id: { type: string }
                            sku: { type: string }
                            name: { type: string }
                        quantity_total: { type: integer }
                        updated_at:
                          type: string
                          nullable: true
                        locations:
                          type: array
                          items:
                            type: object
                            properties:
                              quantity: { type: integer }
                              compartment:
                                nullable: true
                                oneOf:
                                  - type: 'null'
                                  - type: object
                                    properties:
                                      id: { type: string }
                                      code: { type: string }
                              ambiente:
                                nullable: true
                                oneOf:
                                  - type: 'null'
                                  - type: object
                                    properties:
                                      id: { type: string }
                                      name: { type: string }
                  meta:
                    type: object
              example:
                data:
                  - product: { id: "10000000-0000-4000-8000-000000000001", sku: "SR-GLV-001", name: "Guantes de nitrilo talla M" }
                    quantity_total: 165
                    updated_at: "2026-05-07T08:00:00+02:00"
                    locations:
                      - quantity: 120
                        compartment: { id: "50000000-0000-4000-8000-000000000001", code: "A1-C1" }
                        ambiente: { id: "40000000-0000-4000-8000-000000000001", name: "Ambiente Urgencias A1" }
                      - quantity: 45
                        compartment: null
                        ambiente: null
                meta: {}
        '401':
          description: Unauthorized
  /api/v1/inventory/products/{product_id}:
    patch:
      summary: Adjust product inventory quantities (ADMIN only, for incident correction)
      description: |
        Sets stock quantities per location for a product. Does not create entry/exit logs.
        Restricted to ADMIN role.
      tags: [Inventory]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locations]
              properties:
                locations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [quantity]
                    properties:
                      quantity:
                        type: integer
                        minimum: 0
                      compartment_id:
                        type: string
                        format: uuid
                        nullable: true
            example:
              locations:
                - quantity: 12
                  compartment_id: "50000000-0000-4000-8000-000000000001"
                - quantity: 3
                  compartment_id: null
      responses:
        '200':
          description: Updated stock by location
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductStockLocations'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (requires ADMIN)
        '404':
          description: Product not found
        '422':
          description: Validation error
  /api/v1/products:
    get:
      summary: List products
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Products list
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    post:
      summary: Create product
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Product created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/products/{id}:
    get:
      summary: Get product
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    patch:
      summary: Patch product
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Product updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation error
    delete:
      summary: Soft delete product
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/products/{id}/stock-locations:
    get:
      summary: Stock locations for a product (for entry/exit compartment pickers)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Product public id (UUID)
      responses:
        '200':
          description: Product stock broken down by ambiente/compartment (quantity > 0 only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductStockLocations'
              example:
                data:
                  product:
                    id: "10000000-0000-4000-8000-000000000001"
                    sku: "SR-GLV-001"
                    name: "Guantes de nitrilo talla M"
                  quantity_total: 165
                  locations:
                    - quantity: 120
                      compartment: { id: "50000000-0000-4000-8000-000000000001", code: "A1-C1" }
                      ambiente: { id: "40000000-0000-4000-8000-000000000001", name: "Ambiente Urgencias A1" }
                    - quantity: 45
                      compartment: null
                      ambiente: null
        '401':
          description: Unauthorized
        '404':
          description: Product not found in clinic
  /api/v1/users:
    get:
      summary: List clinic users
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create user
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, TECHNICIAN, STAFF]
                is_active:
                  type: boolean
      responses:
        '201':
          description: User created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/users/{id}:
    get:
      summary: Get user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
    patch:
      summary: Patch user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, TECHNICIAN, STAFF]
                is_active:
                  type: boolean
                password:
                  type: string
      responses:
        '200':
          description: User updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation error
    delete:
      summary: Soft delete user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/ambientes/tree:
    get:
      summary: List ambientes with nested compartments (UI catalog)
      tags: [Ambientes]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
          description: When set, filters both ambientes and compartments by is_active
      responses:
        '200':
          description: Ambientes each with a compartments array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        location:
                          type: string
                          nullable: true
                        device_id:
                          type: string
                          nullable: true
                        is_active:
                          type: boolean
                        compartments:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              ambiente_id:
                                type: string
                              code:
                                type: string
                              is_active:
                                type: boolean
              example:
                data:
                  - id: "40000000-0000-4000-8000-000000000001"
                    name: "Ambiente Urgencias A1"
                    location: "Planta 1 - Urgencias"
                    device_id: "SR-A1-LOCK"
                    is_active: true
                    compartments:
                      - id: "50000000-0000-4000-8000-000000000001"
                        ambiente_id: "40000000-0000-4000-8000-000000000001"
                        code: "A1-C1"
                        is_active: true
                      - id: "50000000-0000-4000-8000-000000000002"
                        ambiente_id: "40000000-0000-4000-8000-000000000001"
                        code: "A1-C2"
                        is_active: true
        '401':
          description: Unauthorized
        '422':
          description: Invalid active filter
  /api/v1/ambientes:
    get:
      summary: List ambientes
      tags: [Ambientes]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: active
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Ambientes list
        '401':
          description: Unauthorized
    post:
      summary: Create ambiente
      tags: [Ambientes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                location:
                  type: string
                is_active:
                  type: boolean
                device_id:
                  type: string
                  description: MQTT device id for lock commands (ambientes/{deviceId}/cmd)
      responses:
        '201':
          description: Ambiente created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/ambientes/{id}:
    get:
      summary: Get ambiente detail
      tags: [Ambientes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ambiente detail
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    patch:
      summary: Patch ambiente
      tags: [Ambientes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
                is_active:
                  type: boolean
                device_id:
                  type: string
                  nullable: true
                  description: Set MQTT device id; send null to clear
      responses:
        '200':
          description: Ambiente updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation error
    delete:
      summary: Soft delete ambiente
      tags: [Ambientes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/compartments:
    get:
      summary: List compartments
      tags: [Compartments]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ambiente_id
          required: false
          schema:
            type: string
        - in: query
          name: active
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Compartments list
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    post:
      summary: Create compartment
      tags: [Compartments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ambiente_id, code]
              properties:
                ambiente_id:
                  type: string
                code:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Compartment created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/compartments/{id}:
    get:
      summary: Get compartment detail
      tags: [Compartments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compartment detail
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    patch:
      summary: Patch compartment
      tags: [Compartments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Compartment updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Validation error
    delete:
      summary: Soft delete compartment
      tags: [Compartments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /api/v1/entry-logs:
    get:
      summary: List entry logs by clinic
      tags: [EntryLogs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Entry logs list with ambiente and compartment when set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntryLogListItem'
        '401':
          description: Unauthorized
    post:
      summary: Register stock entry and increase inventory
      tags: [EntryLogs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, quantity]
              properties:
                sku:
                  type: string
                name:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                note:
                  type: string
                compartment_id:
                  type: string
                  description: Optional destination compartment UUID
                ambiente_id:
                  type: string
                  description: Optional; only with compartment_id, must match compartment ambiente
      responses:
        '201':
          description: Entry log created with location enrichment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      entry_log:
                        $ref: '#/components/schemas/EntryLogListItem'
                      inventory:
                        type: object
                        properties:
                          sku: { type: string }
                          quantity: { type: integer }
                          compartment_id: { type: string, nullable: true }
                          ambiente:
                            $ref: '#/components/schemas/AmbienteRef'
                          compartment:
                            $ref: '#/components/schemas/CompartmentRef'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /api/v1/exit-logs:
    get:
      summary: List exit logs by clinic
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exit logs list
        '401':
          description: Unauthorized
    post:
      summary: Create draft exit log (per-product locations; stock changes on confirm only)
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                note:
                  type: string
                items:
                  type: array
                  minItems: 1
                  description: One entry per product_id. Use locations for explicit per-compartment quantities, or legacy quantity/compartment_id fields.
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/ExitLogCreateItemWithLocations'
                      - $ref: '#/components/schemas/ExitLogCreateItemLegacy'
      responses:
        '201':
          description: Draft exit log created. Each items entry is one product with nested locations (one per DB line). Header location reflects the first compartment when present.
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /api/v1/exit-logs/{id}:
    get:
      summary: Get exit log detail with enriched items
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Exit log numeric id
      responses:
        '200':
          description: Exit log detail
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update requested quantities on draft exit log (all zero cancels the log)
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [item_id, quantity]
                    properties:
                      item_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 0
      responses:
        '200':
          description: Updated exit log
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation or state error
  /api/v1/exit-logs/{id}/confirm:
    post:
      summary: Confirm exit log (validates stock, decrements inventory, sets CONFIRMED; all lines zero becomes CANCELLED)
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Confirmed or idempotent repeat
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: State or stock error
  /api/v1/exit-logs/{id}/cancel:
    post:
      summary: Cancel draft exit log
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled exit log
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: State error
  /api/v1/exit-logs/{id}/open-lock:
    post:
      summary: Open lock (only after exit log is CONFIRMED; uses first linked compartment; multi-compartment exits may need multiple calls or a future extension)
      tags: [ExitLogs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Exit log numeric id
      responses:
        '200':
          description: Command accepted and published (or no-op if MQTT disabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      exit_log_id:
                        type: string
                      device_id:
                        type: string
                      topic:
                        type: string
                      payload:
                        type: string
                  meta:
                    type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Exit log not found
        '422':
          description: Exit log cannot open lock (e.g. no compartment or device)
        '502':
          description: MQTT publish failed
  /api/v1/incidents:
    get:
      summary: List incidents by clinic
      tags: [Incidents]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Incidents list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create incident
      tags: [Incidents]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, severity, source]
              properties:
                title:
                  type: string
                description:
                  type: string
                severity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, CRITICAL]
                source:
                  type: string
                  enum: [ERP, AMBIENTE]
      responses:
        '201':
          description: Incident created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation error
  /api/v1/settings:
    get:
      summary: List settings by clinic
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings list
        '401':
          description: Unauthorized
    post:
      summary: Upsert setting by clinic
      tags: [Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                value:
                  type: string
      responses:
        '201':
          description: Setting upserted
        '401':
          description: Unauthorized
        '422':
          description: Validation error
  /docs:
    get:
      summary: OpenAPI YAML
      tags: [Docs]
      responses:
        '200':
          description: OK
  /docs/ui:
    get:
      summary: Swagger UI
      tags: [Docs]
      responses:
        '200':
          description: OK
components:
  schemas:
    AmbienteRef:
      nullable: true
      oneOf:
        - type: 'null'
        - type: object
          properties:
            id: { type: string }
            name: { type: string }
            device_id: { type: string, nullable: true }
    CompartmentRef:
      nullable: true
      oneOf:
        - type: 'null'
        - type: object
          properties:
            id: { type: string }
            code: { type: string }
    StockLocation:
      type: object
      properties:
        ambiente:
          $ref: '#/components/schemas/AmbienteRef'
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
    InventoryLocation:
      type: object
      properties:
        quantity: { type: integer }
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
        ambiente:
          $ref: '#/components/schemas/AmbienteRef'
    ProductStockLocations:
      type: object
      properties:
        product:
          type: object
          properties:
            id: { type: string }
            sku: { type: string }
            name: { type: string }
        quantity_total: { type: integer }
        locations:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLocation'
    EntryLogListItem:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        quantity: { type: integer }
        note: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string }
        ambiente:
          $ref: '#/components/schemas/AmbienteRef'
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
    ExitLogCreateLocationAllocation:
      type: object
      required: [compartment_id, quantity]
      properties:
        compartment_id:
          type: string
          description: Compartment public id (required for each allocation)
        quantity:
          type: integer
          minimum: 1
        ambiente_id:
          type: string
          description: Optional; only with compartment_id, must match compartment ambiente
    ExitLogCreateItemWithLocations:
      type: object
      required: [product_id, locations]
      properties:
        product_id:
          type: string
          description: Product public id (26 chars); at most one items entry per product_id
        locations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExitLogCreateLocationAllocation'
    ExitLogCreateItemLegacy:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          description: Product public id (26 chars); at most one items entry per product_id
        quantity:
          type: integer
          minimum: 1
        compartment_id:
          type: string
          description: Optional compartment public id (single allocation)
        ambiente_id:
          type: string
          description: Optional; only with compartment_id, must match compartment ambiente
    ExitLogLocationLine:
      type: object
      properties:
        item_id:
          type: string
          description: Internal exit_log_items id (use in PATCH)
        requested_quantity: { type: integer }
        confirmed_quantity: { type: integer, nullable: true }
        stock_available: { type: integer, nullable: true }
        ambiente:
          $ref: '#/components/schemas/AmbienteRef'
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
    ExitLogProductItem:
      type: object
      properties:
        product:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            sku: { type: string, nullable: true }
            barcode: { type: string, nullable: true }
        requested_quantity_total:
          type: integer
          description: Sum of requested_quantity across locations for this product
        confirmed_quantity_total:
          type: integer
          nullable: true
          description: Sum of confirmed quantities when all lines are confirmed; null in draft
        locations:
          type: array
          items:
            $ref: '#/components/schemas/ExitLogLocationLine'
    ExitLogHeader:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        note: { type: string, nullable: true }
        location:
          $ref: '#/components/schemas/StockLocation'
        compartment_public_id:
          type: string
          nullable: true
          deprecated: true
          description: Use location.compartment.id instead
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaqueToken
