        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: Server-generated; read-only. Not accepted on create/patch.
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    OperationalRole:
      type: object
      properties:
        id: { type: string, format: uuid }
