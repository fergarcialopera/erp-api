components:
  schemas:
    LockerRef:
      nullable: true
      oneOf:
        - type: 'null'
        - type: object
          properties:
            id: { type: string }
            name: { type: string }
            device_id: { type: string, nullable: true }
    CompartmentRef:
      nullable: true
      oneOf:
        - type: 'null'
        - type: object
          properties:
            id: { type: string }
            code: { type: string }
    StockLocation:
      type: object
      properties:
        locker:
          $ref: '#/components/schemas/LockerRef'
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
    InventoryLocation:
      type: object
      properties:
        quantity: { type: integer }
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
        locker:
          $ref: '#/components/schemas/LockerRef'
    ProductStockLocations:
      type: object
      properties:
        product:
          type: object
          properties:
            id: { type: string }
            sku: { type: string }
            name: { type: string }
        quantity_total: { type: integer }
        locations:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLocation'
    EntryLogListItem:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        quantity: { type: integer }
        note: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string }
        locker:
          $ref: '#/components/schemas/LockerRef'
        compartment:
          $ref: '#/components/schemas/CompartmentRef'
    ExitLogHeader:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        note: { type: string, nullable: true }
        location:
          $ref: '#/components/schemas/StockLocation'
        compartment_public_id:
          type: string
          nullable: true
          deprecated: true
          description: Use location.compartment.id instead
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaqueToken
