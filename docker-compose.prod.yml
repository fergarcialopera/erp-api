# Override de producción. Combinar siempre con docker-compose.yml:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Variables sensibles: .env.production en el servidor (no versionado).
# API en el puerto 8080 del host; el frontend React usa el puerto 80 (repo aparte).

services:
  nginx:
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes: !reset
      - ./:/var/www/html
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro

  php:
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on: !reset
      - postgres
      - redis
      - mosquitto

  postgres:
    restart: unless-stopped
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  mosquitto:
    restart: unless-stopped
    ports: []

  mailpit:
    profiles: ["dev"]
