# Override de producción. Combinar siempre con docker-compose.yml:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Variables sensibles: .env.production en el servidor (no versionado).
# Nginx termina TLS en :443 (certificados Let's Encrypt del host, ver README §10)
# y sirve el SPA (FRONTEND_DIST_PATH, p. ej. ../erp-frontend/dist) y el API.
# El :80 queda para el challenge ACME, el health check local (/up) y la redirección a HTTPS.

services:
  php:
    env_file:
      - .env.production

  nginx:
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dominio público (.env.production); la imagen oficial renderiza la plantilla con envsubst.
      SERVER_NAME: ${SERVER_NAME}
      NGINX_ENVSUBST_FILTER: ^SERVER_NAME$
    volumes:
      - ./:/var/www/html
      - ${FRONTEND_DIST_PATH:-/root/erp-frontend/dist}:/var/www/frontend:ro
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      # Certificados emitidos por certbot en el host (live/ contiene symlinks a archive/,
      # por eso se monta /etc/letsencrypt completo).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot donde certbot deja el challenge ACME en las renovaciones.
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
