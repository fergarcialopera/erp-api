# Override local. Combinar con docker-compose.yml y activar profile dev (mailpit):
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.dev.yml --profile dev up -d
#   make up

services:
  nginx:
    ports:
      - "8080:80"
    environment:
      # Origen permitido para CORS; la imagen oficial renderiza la plantilla con envsubst.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NGINX_ENVSUBST_FILTER: ^FRONTEND_URL$
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  mosquitto:
    ports:
      - "1883:1883"
